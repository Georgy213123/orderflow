name: orderflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow-local
      POSTGRES_DB: orderflow
    ports:
      - "127.0.0.1:55301:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://orderflow:orderflow-local@postgres:5432/orderflow
      REQUEST_PARSER: rules
      CORS_ORIGINS: http://localhost:5301
    ports:
      - "127.0.0.1:8301:8301"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8301/api/health')"
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5301:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
